name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest --pyargs tsverify.selftest
      - run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.oracle:OracleAdapter
      - run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.toy:ToyAdapter

  plasmapy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[test,plasmapy]"
      - run: pip list | grep -i -E "plasmapy|astropy|numpy|scipy"
      - run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.plasmapy:PlasmaPyAdapter -rs
