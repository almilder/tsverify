name: selftest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install ".[test]"
      - run: pytest --pyargs tsverify.selftest
      - if: matrix.python-version != '3.13'
        run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.oracle:OracleAdapter -m "not slow"
      - if: matrix.python-version == '3.13'
        run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.oracle:OracleAdapter --durations=10 --ts-report report-oracle.md
      - run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.toy:ToyAdapter --ts-report report-toy.md
      - name: File route with the toy code
        run: |
          tsverify export bundle --format csv
          tsverify respond bundle tsverify.adapters.toy:ToyAdapter
          tsverify score bundle --name toy --report report-files.md

  plasmapy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ".[test,plasmapy]"
      - run: pip list | grep -i -E "plasmapy|astropy|numpy|scipy"
      - run: pytest --pyargs tsverify.conformance --ts-adapter tsverify.adapters.plasmapy:PlasmaPyAdapter -rs
