name: bundle

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install .
      - name: Export the canonical bundles
        run: |
          tsverify export bundle-csv --format csv --slow
          tsverify export bundle-json --format json --slow
          zip -qr "tsverify-${GITHUB_REF_NAME}-bundle-csv.zip" bundle-csv
          zip -qr "tsverify-${GITHUB_REF_NAME}-bundle-json.zip" bundle-json
      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "tsverify ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md. The bundles hold every run's inputs and the oracle's answers for tsverify's canonical conventions."
          gh release upload "$GITHUB_REF_NAME" tsverify-*-bundle-*.zip --clobber
      - uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: bundles
          path: tsverify-*-bundle-*.zip
